# Set prefix key to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set terminal color
set -as terminal-features ',xterm-256color:RGB'

# Disable mouse support (keyboard-driven workflow)
set -g mouse off

# Start panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open panes in current directory
bind '-' split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Keyboard-driven pane navigation (replaces click-to-focus)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Keyboard-driven pane resizing (replaces drag-to-resize)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Set status bar to top
set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Custom Colors
set -ogq @thm_grade1 "#041E42"
set -ogq @thm_grade2 "#2D4269"
set -ogq @thm_grade3 "#56768F"
set -ogq @thm_grade4 "#7FAAB6"
set -ogq @thm_grade5 "#B8DDEB"
set -ogq @thm_white "#FFFFFF"
set -ogq @thm_black "#000000"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{?client_prefix,#{@thm_grade1},#{@thm_white}}"

set -ogq @catppuccin_window_number_color "#{@thm_grade2}"
set -g @catppuccin_window_current_text "#{window_name}"
set -ogq @catppuccin_window_text "#{window_name}"
set -g @catppuccin_status_right_separator "#{?client_prefix,#{#[bg=#{@thm_bg},fg=#{@thm_red},bold]  },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  }}"
set -ogq @catppuccin_status_module_bg_color "#{@thm_bg}"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.config/tmux/plugins/tmux/catppuccin.tmux`

# Status line stuff
set -g status-right-length 150
set -g status-left-length 100
set -g status-left ""
set -g status-right ""
# Show logging status (and log file path) for the current pane
set -ag status-right "#{?pane_pipe,#[fg=#{@thm_green}]~/.tmux/logs/#(basename \"$(ls -t ~/.tmux/logs/tmux-#{session_name}-#{window_index}-#{pane_index}-*.log 2>/dev/null | head -1)\" 2>/dev/null) ● LOGGING ,#[fg=#{@thm_red}]● NOT LOGGING }#[fg=default]"

set -agF status-right "#{@catppuccin_status_session}"

# tmux-logging
set -g @logging-filename ".tmux/logs/tmux-#{session_name}-#{window_index}-#{pane_index}-%Y%m%dT%H%M%S.log"

# Auto-start logging for every new session, window, and split/pane
set-hook -g session-created 'run "~/.config/tmux/plugins/tmux-logging/scripts/toggle_logging.sh"'
set-hook -g after-new-window 'run "~/.config/tmux/plugins/tmux-logging/scripts/toggle_logging.sh"'
set-hook -g after-split-window 'run "~/.config/tmux/plugins/tmux-logging/scripts/toggle_logging.sh"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
